[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Listen to a meeting, write labelled lines to JSONL, and let a Claude Code session read along."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "sherpa-onnx>=1.12",
    "sounddevice>=0.4.7",
    "soxr>=0.3.7",
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
]

[project.scripts]
copilot = "meeting_copilot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
